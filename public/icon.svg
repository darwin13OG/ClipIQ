<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle glow layer behind glyph -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M190 148 L350 256 L190 364 Z" fill="url(#glyphGrad)" />
  </g>

  <!-- Play Symbol combined with Video Intelligence Bars -->
  <!-- Left Wave Bar 1 -->
  <rect x="130" y="220" width="22" height="72" rx="11" fill="url(#glyphGrad)" />
  <!-- Wave Bar 2 -->
  <rect x="166" y="180" width="22" height="152" rx="11" fill="url(#glyphGrad)" />

  <!-- Play Triangle with Cut / IQ Aperture -->
  <path d="M214 162 C214 150 227 142 237 149 L362 243 C372 250 372 262 362 269 L237 363 C227 370 214 362 214 350 Z" fill="url(#glyphGrad)" />

  <!-- Futuristic IQ Spark in Top-Right -->
  <circle cx="370" cy="150" r="14" fill="#38bdf8" />
  <path d="M370 120 L370 180 M340 150 L400 150" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
